advanced.multiUserMode.tooltip = Lorsqu'elle est activée, tous les élèves d'une équipe ou d'une classe peuvent collaborer sur la même carte mentale. Lorsqu'elle est désactivée, chaque élève crée une carte mentale individuelle.
label.authoring.advance.gallery.walk.enabled.tooltip = Utilisez Gallery Walk pour favoriser les discussions inter- et intra-équipes, la réflexion d'ordre supérieur, l'apprentissage coopératif et la cohésion d'équipe. Si cette option est activée, après avoir lancé Gallery Walk dans Surveillance, les cartes mentales créées pour chaque équipe sont partagées avec toutes les autres équipes. Les élèves peuvent alors, au sein de leurs équipes, donner des commentaires et évaluer le travail des autres.
advanced.lockOnFinished.tooltip = Une fois cette option activée, les étudiants, une fois la carte mentale terminée, ne pourront plus y ajouter de contenu ni la modifier.
