advanced.multiUserMode.tooltip = Wenn diese Funktion aktiviert ist, können alle Studierende eines Teams/einer Klasse gemeinsam an einer Mindmap arbeiten. Ist sie deaktiviert, erstellt jeder Schüler eine eigene Mindmap.
label.authoring.advance.gallery.walk.enabled.tooltip = Verwenden Sie Gallery Walk, um Diskussionen innerhalb und zwischen Teams, höheres Denken, kooperatives Lernen und Teambildung zu fördern. Wenn aktiviert, werden nach dem Start von Gallery Walk in der Überwachung die für jedes Team erstellten Mindmaps mit allen anderen Teams geteilt. Die Studierenden können dann in ihren Teams einander Feedback geben und die Arbeit bewerten.
advanced.lockOnFinished.tooltip = Wenn diese Option aktiviert ist, können die Studierenden, nachdem sie die Mindmap abgeschlossen haben, beim erneuten Aufrufen keine weiteren Inhalte hinzufügen oder die Mindmap verändern.
