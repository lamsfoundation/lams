activity.title = Forum
activity.description = On-line diskusjonsforum (asynkron).
activity.helptext = Forumverktøyet lar elever og lærere holde strukturerte diskusjoner på nett, der lærere kan legge ut spørsmål eller ressurser, og elevene kan svare, stille spørsmål og bygge videre på hverandres ideer i sitt eget tempo. Det brukes primært i asynkrone settinger, holder samtalene organisert i tråder, tillater moderering for å opprettholde et respektfullt miljø, og gir et rom for roligere elever til å bidra trygt, samtidig som det gir lærerne en klar oversikt over deltakelse og forståelse.
