activity.title = Forum
activity.description = Un outil permettant les discussions en ligne structurées  (asynchrones)
activity.helptext = Cet outil de forum permet aux élèves et aux enseignants de tenir des discussions structurées en ligne, où les enseignants peuvent publier des suggestions ou des ressources et où les élèves peuvent répondre, poser des questions et développer les idées des uns et des autres à leur propre rythme ; utilisé principalement dans des contextes asynchrones, il organise les conversations en fils de discussion, permet la modération pour maintenir un environnement respectueux et offre un espace aux élèves plus discrets pour contribuer en toute confiance tout en donnant aux enseignants une vue d'ensemble claire de la participation et de la compréhension.
