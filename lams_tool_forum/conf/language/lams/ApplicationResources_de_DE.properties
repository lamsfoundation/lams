activity.title = Forum
activity.description = Online Diskussion (asynchron-zeitversetzt)
activity.helptext = Das Forum-Tool ermöglicht es Schülern und Lehrern, strukturierte Online-Diskussionen zu führen. Lehrer können Anregungen oder Ressourcen veröffentlichen, und die Schüler können antworten, Fragen stellen und die Ideen der anderen in ihrem eigenen Tempo weiterentwickeln. Es wird hauptsächlich in asynchronen Lernumgebungen eingesetzt, hält die Gespräche in Threads organisiert, ermöglicht der Moderation die Aufrechterhaltung einer respektvollen Atmosphäre und bietet ruhigen Schülern einen Raum, um selbstbewusst beizutragen, während es den Lehrern einen klaren Überblick über die Beteiligung und das Verständnis gibt.
