activity.helptext = フォーラム ツールを使用すると、生徒と教師はオンラインで構造化されたディスカッションを行うことができます。教師はプロンプトやリソースを投稿でき、生徒は自分のペースで返信したり、質問したり、お互いのアイデアを基に構築したりできます。主に非同期の設定で使用されるこのツールは、スレッドで会話を整理し、モデレーションによって敬意のある環境を維持できるようにします。また、静かな生徒が自信を持って発言できるスペースを提供すると同時に、教師には参加と理解の明確な概要を示します。
