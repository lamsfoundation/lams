label.monitoring.question.summary.append.comment.description.3 = bu soruya yorum yapın
label.monitoring.option.correct.percent = Bu seçenek soru işaretinin %100'ünden daha azını verecek şekilde ayarlanmıştır.
label.groups.choices.correct.answer = Doğru cevap
label.groups.choices.question.type = Soru türü
