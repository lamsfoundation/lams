label.authoring.advance.learner.interaction = Öğrencinin etkileşimi
label.authoring.advance.notifications = Bildirimler
label.authoring.advance.shuffle.questions.tooltip = Etkinleştirildiğinde, soruların sırası her öğrenci için rastgele belirlenir. Bu, öğrenciler arasında cevap paylaşımını azaltırken değerlendirme içeriğinin herkes için aynı kalmasını sağlar.
label.authoring.advance.shuffle.answers.tooltip = Etkinleştirildiğinde, cevap seçeneklerinin sırası her öğrenci için rastgele belirlenir. Bu, cevap paylaşımını en aza indirmeye ve sabit seçenek konumlarından kaynaklanan önyargıyı azaltmaya yardımcı olurken, içeriği herkes için aynı tutar.
label.authoring.advance.numbered.questions.tooltip = Etkinleştirildiğinde, her soru öğrencilerin ilerlemelerini takip etmelerine ve değerlendirme sırasında belirli sorulara kolayca başvurmalarına yardımcı olmak için görünür bir numara gösterecektir.
label.authoring.advance.display.summary.tooltip = Etkinleştirilirse, öğrenciler değerlendirmeyi tamamladıktan sonra tüm soruları ve bunlara karşılık gelen yanıtları gözden geçirebileceklerdir.
label.authoring.advance.allow.students.overall.feedback.tooltip = Etkinleştirildiğinde, öğrenciler bir denemeyi tamamladıktan sonra değerlendirme için tanımlanan genel geri bildirim mesajını görecekler. Gösterilen geri bildirim, elde ettikleri puan aralığına karşılık gelecek ve genel performanslarını anlamalarına yardımcı olacaktır.
label.authoring.advance.show.max.mark.tooltip = Etkinleştirildiğinde, öğrenciler her soru için alabilecekleri maksimum puanı görecek ve bu da onların değerlendirmedeki her bir sorunun ağırlığını ve önemini anlamalarına yardımcı olacaktır.
label.authoring.advance.allow.students.grades.tooltip = Etkinleştirildiğinde, öğrenciler bir denemeyi tamamladıktan hemen sonra aldıkları toplam notları görebilecekler ve böylece daha fazla inceleme veya geri bildirim almadan önce performanslarını değerlendirebilecekler.
label.authoring.advance.answer.justification.tooltip = Etkinleştirilirse, öğrencilerden seçtikleri cevap için kısa bir yazılı gerekçe sunmaları istenecek ve öğrencilerden gerekçelerini açıklamaları ve soruyu nasıl anladıklarını yansıtmaları istenecektir.
label.enable.confidence.levels.tooltip = Etkinleştirildiğinde, öğrenciler seçilen cevabın doğru olduğundan ne kadar emin olduklarını belirtebilirler. Bu güven seviyeleri daha sonra ekip değerlendirmesi (tRAT) sırasında tüm ekip üyelerine gösterilerek tartışmaya rehberlik eder ve belirsizlik alanlarını vurgular.
label.scale.tooltip = Lütfen aktivitenize veya değerlendirmenize en uygun olduğuna inandığınız güven ölçeğini seçin.
label.use.select.leader.tool.output.tooltip = Etkinleştirildiğinde, yalnızca önceki Lider Seçimi aracında seçilen ekip lideri grup adına yanıt gönderebilir. Bu seçenek, derste daha önce bir Lider Seçimi etkinliğinin tamamlanmış olmasını gerektirir.
label.authoring.advance.questions.per.page.tooltip = Her sayfada kaç soru gösterileceğini seçin ve ayarlayın. Bu, kaydırmayı azaltarak ve öğrencilerin aynı anda daha küçük bir soru grubuna odaklanmalarını sağlayarak uzun değerlendirmeleri yönetmeye yardımcı olur.
label.authoring.advance.sections.tooltip = Değerlendirme içerisinde farklı bölümler oluşturabilir ve soruları buna göre gruplandırabilirsiniz. 
label.authoring.advance.burning.question.tooltip = Etkinleştirildiğinde, öğrenciler yardıma ihtiyaç duydukları belirli sorular, yanıtlar veya kavramlarla ilgili önemli sorular, itirazlar veya zorluklar dile getirebilirler. Bunlar doğrudan gönderilir ve değerlendirme oturumu sırasında veya sonrasında kolayca inceleyip yanıtlayabilecekleri öğretim görevlilerine gösterilir.
