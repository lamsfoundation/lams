label.authoring.advance.time.limit.threshold = Eşik
label.authoring.advance.time.limit.threshold.tooltip = Bu geri sayım sayacı, eş zamanlı değerlendirmeler için idealdir. Öğrencilerin %50'si görevi tamamladığında başlar. Kalan öğrencilerin *geçen sürenin* yüzde kaçını tamamlaması gerektiğini belirleyebilirsiniz. Kalan tüm öğrenciler, zamanlayıcı dolmadan görevi tamamlamalıdır.
label.learning.burning.question.button.tooltip = Bu soruyla ilgili bir sorunuz mu var veya açıklamaya mı ihtiyacınız var?
