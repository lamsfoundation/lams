label.authoring.advance.discussion.tooltip = Bu özellik etkinleştirildiğinde, öğretmenlerin öğrencilerin belirli bir soru için daha fazla tartışmaya gerek olup olmadığına veya sınıfın devam etmeye hazır olup olmadığına oy verebilecekleri bir anket başlatmalarına olanak tanır. Bu, genel duygu hakkında gerçek zamanlı geri bildirim sağlar ve öğretim görevlisinin tartışma süresini daha etkili bir şekilde yönetmesine yardımcı olur.
label.prevent.learner.autosave.mutliple.tabs = Bu sınav için açık iki LAMS sekmeniz var gibi görünüyor. Lütfen bunlardan birini kapatın. Aksi takdirde, cevaplar düzgün bir şekilde kaydedilmeyecek ve puanınızı etkileyecektir.
label.authoring.advance.time.limit.individual.description.1 = Her öğrencinin, başladığı andan itibaren başlayan bireysel bir geri sayım sayacı vardır.
label.authoring.advance.time.limit.individual.description.2 = Her öğrencinin alacağı dakika sayısını seçin
