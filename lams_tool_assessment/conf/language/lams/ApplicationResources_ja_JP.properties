label.monitoring.question.summary.append.comment.confirm = この回答を選択したすべての学生に、指定されたコメントを追加してもよろしいですか?
label.monitoring.question.summary.append.comment.button = コメントを追加
label.monitoring.question.summary.append.comment.description.3 = この質問へのコメント
label.monitoring.option.correct.percent = このオプションは、クエスチョンマークが100％未満になるように設定されている。
label.groups.choices.correct.answer = 正解
label.groups.choices.question.type = 質問タイプ
label.authoring.advance.question.behaviours = 質問行動
label.authoring.advance.feedback.and.results = フィードバックと結果
label.authoring.advance.learner.interaction = 学生の交流
label.authoring.advance.notifications = お知らせ
label.authoring.advance.shuffle.questions.tooltip = 有効にすると、生徒ごとに質問の順序がランダム化されます。これにより、生徒間での回答の共有を減らしながら、評価内容を全員に同じに保つことができます。
label.authoring.advance.shuffle.answers.tooltip = 有効にした場合、解答の選択肢の順番は学生ごとにランダムになります。これは解答の共有を最小限にし、固定された選択肢の位置によるバイアスを軽減するのに役立ちます。
label.authoring.advance.numbered.questions.tooltip = 有効にすると、各質問に目に見える数字が表示されるため、学生は進捗状況を追跡し、評価中に特定の質問を簡単に参照できるようになります。
label.authoring.advance.display.summary.tooltip = 有効にした場合、学生は評価終了後、すべての問題と対応する解答を確認することができます。
label.authoring.advance.allow.students.overall.feedback.tooltip = 有効にすると、学生は課題を完了した後、その評価に定義された全体的なフィードバックメッセージが表示されます。表示されるフィードバックは、学生が獲得したスコアの範囲に対応しており、全体的なパフォーマンスを把握するのに役立ちます。
label.authoring.advance.show.max.mark.tooltip = 有効にすると、学生は各質問で獲得可能な最高点を確認できるため、評価における個々の質問の重みと重要性を理解するのに役立ちます。
label.authoring.advance.allow.students.grades.tooltip = 有効にすると、学生は試行を完了した直後に獲得した合計点数を確認できるため、さらにレビューやフィードバックを受ける前に自分のパフォーマンスを評価できます。
label.authoring.advance.answer.justification.tooltip = 有効にすると、生徒は選択した回答の理由を簡潔に記述するよう求められ、その理由を説明し、質問の理解について振り返ることが促されます。
label.enable.confidence.levels.tooltip = 有効にすると、生徒は選択した回答が正解であることにどの程度自信があるか、または確信があるかを示すことができます。これらの自信レベルは、チームアセスメント（tRAT）中にチームメンバー全員に表示されるため、議論を導き、不確かな点を浮き彫りにするのに役立ちます。
label.scale.tooltip = あなたの活動や評価に最も適していると思われる信頼尺度を選択してください。
label.authoring.advanced.notify.on.attempt.completion.tooltip = 有効にすると、学生が評価を完了するたびに、講師にメール通知が送信されます。これにより、進捗状況をリアルタイムで把握できますが、学生数が多いクラスでは大量のメールが生成される場合があります。
label.use.select.leader.tool.output.tooltip = 有効にすると、リーダー選出ツールで選ばれたチームリーダーのみがグループを代表して回答を送信できます。このオプションを使用するには、レッスンでリーダー選出アクティビティを既に完了している必要があります。
label.authoring.advance.questions.per.page.tooltip = 各ページに表示される質問の数を選択します。これにより、スクロールが減り、生徒が一度に少ない数の質問に集中できるようになるため、長いテストを管理するのに役立ちます。
label.authoring.advance.sections.tooltip = 評価内にさまざまなセクションを作成し、それに応じて質問をグループ化できます。 
label.authoring.advance.burning.question.tooltip = この機能を有効にすると、学生は特定の質問、回答、または概念に関して、支援が必要な重要な質問、異議申し立て、または異議申し立てを提出できます。これらの質問は直接提出され、講師に表示されます。講師は評価セッション中または評価セッション後にこれらの質問を簡単に確認し、対処することができます。
