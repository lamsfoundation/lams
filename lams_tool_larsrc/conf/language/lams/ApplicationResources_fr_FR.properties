label.authoring.advance.gallery.walk.enabled.tooltip = Utilisez Gallery Walk pour promouvoir les discussions inter et intra-équipes, la réflexion d'ordre supérieur, l'apprentissage coopératif et la constitution d'équipes. Si cette option est activée, après le démarrage de Gallery Walk in Monitoring, le document créé pour chaque équipe est partagé avec toutes les autres équipes. Les étudiants de leurs équipes peuvent ensuite se faire part de leurs commentaires et évaluer leur travail.
label.use.select.leader.tool.output.tooltip = Si vous utilisez l'outil de sélection des responsables pour cette leçon, cette option signifie que seuls les responsables de chaque équipe pourront soumettre des ressources au nom de leur équipe.
