label.authoring.advance.gallery.walk.info1 = 「Gallery Walk」を使って、チーム間・チーム内のディスカッション、高次の思考、協同学習、そしてチームビルディングを促進しましょう。
label.authoring.advance.gallery.walk.info2 = 有効にすると、ギャラリーウォークを開始した後、各チームがアップロードしたリソースが他のすべてのチームに共有されます。その後、チームはお互いにフィードバックを与え、お互いの作品を評価することができます。
