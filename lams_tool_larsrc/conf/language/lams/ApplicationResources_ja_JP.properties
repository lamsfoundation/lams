label.gallery.walk.wait.start = この活動では、他のチームの作品を見て、必要に応じてコメントするよう、先生が計画しています。これを「Gallery Walk」と呼びます。先生がGallery Walkを開始するまでお待ちください。開始が遅い場合は、先生に連絡して支援を受けてください。
label.gallery.walk.wait.start.preview = Gallery Walk に進んでください。現在はプレビューモードのため、直ちに進行できます。このメッセージを見ている通常の生徒は、教師がモニタリング画面から Gallery Walk を開始するまで待機する必要があります。
label.gallery.walk.wait.finish.preview = Gallery Walk のまとめに進みます。現在プレビューモードのため、すぐに実行できます。通常の学習者がこのメッセージを受け取った場合は、モニタリング画面で教師が Gallery Walk を終了するまで待つ必要があります。Gallery Walk のまとめに進みます。現在プレビューモードのため、すぐに実行できます。通常の学習者がこのメッセージを受け取った場合は、モニタリング画面で教師が Gallery Walk を終了するまで待つ必要があります。
label.gallery.walk.preview = あなたはプレビュー・モードです。自分のグループしか見えません。通常の学習者は他のグループの作品を見ることができ、コメントや評価をすることができます。
