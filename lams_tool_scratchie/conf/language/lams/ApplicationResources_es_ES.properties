label.authoring.advanced.reveal.double.click.tooltip = Cuando esta opción está habilitada, los líderes de equipo deben hacer doble clic en una respuesta para ver el resultado. Este paso adicional puede ser especialmente útil para las evaluaciones sumativas, ya que proporciona una confirmación adicional antes de que se muestre el resultado, lo que ayuda a reducir las selecciones accidentales y a mantener la integridad de la evaluación.
