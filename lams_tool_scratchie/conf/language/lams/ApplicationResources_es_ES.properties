label.modify.default.marking.tooltip = Por defecto, un equipo recibirá 4 puntos si selecciona la respuesta correcta en su primer intento, 2 puntos en el segundo intento, 1 punto en el tercero, y ningún punto por el cuarto o cualquier otro intento. Sin embargo, este método de puntuación puede modificarse si es necesario, utilizando las opciones de escala de puntuación disponibles en los ajustes.
label.authoring.advance.question.behaviours = Comportamiento de la pregunta
label.authoring.advance.learner.interaction = Interacción del estudiante
label.authoring.basic.list.header.question = Pregunta
label.anonymous.confidence.level.tooltip = Cuando se selecciona esta opción, se ocultan los nombres de los alumnos. Sólo aparecerá el porcentaje de confianza que eligieron junto a la respuesta que seleccionaron.
