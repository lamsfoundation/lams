label.authoring.advanced.reveal.double.click.tooltip = Wenn diese Option aktiviert ist, müssen Teamleiter auf eine Antwort doppelklicken, um das Ergebnis anzuzeigen. Dieser zusätzliche Schritt ist besonders bei summativen Beurteilungen hilfreich, da er eine zusätzliche Bestätigungsebene bietet, bevor das Ergebnis angezeigt wird. Dadurch werden versehentliche Auswahlen reduziert und die Integrität der Beurteilung gewahrt.
label.monitoring.change.leader = Führungskraft wechseln
label.monitoring.leader.successfully.changed = Leiter geändert
label.monitoring.leader.not.changed = Der Anführer wurde nicht geändert
label.qb.stats.tooltip = Die Itemanalyse ist eine Technik, die die Antworten des Lernenden analysiert, um die Wirksamkeit von Fragen in einer Prüfung zu bewerten. Es werden nur Lernende berücksichtigt, die die Aktivität abgeschlossen haben. Es müssen mindestens 2 Lernende anwesend sein.
label.qb.difficulty.index.tooltip = Der Schwierigkeitsindex gibt den Prozentsatz der Schüler an, die die Frage richtig beantwortet haben. Dieser Wert liegt zwischen 0 und 1. Hohe Werte bedeuten, dass die Frage leicht ist, während niedrige Werte bedeuten, dass sie schwierig ist. Ein Wert von 0,3 bis 0,7 gilt als gut für diesen Faktor, und außerhalb dieses Bereichs sind Verbesserungen erforderlich.
label.qb.discrimination.index.tooltip = Der Diskriminierungsindex misst, wie gut eine Frage zwischen Schülern mit mehr Kenntnissen oder Fähigkeiten und solchen mit weniger unterscheidet. Werte nahe +1 deuten darauf hin, dass die Frage gut zwischen leistungsstarken und leistungsschwachen Personen unterscheiden kann. Ein Wert von 0,2 bis 1 gilt für diesen Faktor als gut, -0,2 bis 0,2 ist mittel und unter -0,2 ist eine Verbesserung erforderlich.
label.authoring.advanced.data.import.description = Importiert Konfidenzniveaus oder VSA-Antwortdaten aus anderen Bewertungsaktivitäten (z. B. einem iRAT), um sie in dieser Aktivität anzuzeigen.
label.authoring.advanced.discussion.tooltip = Wenn diese Funktion aktiviert ist, können Lehrkräfte bei der TBL-Überwachung sofortige Umfragen zu jeder brennenden Frage starten, um das Verständnis der Schüler zu bewerten.
label.vsa.allocate.button = VSAs zuweisen
label.prevent.learner.autosave.mutliple.tabs = Sie scheinen zwei LAMS-Registerkarten für diese Prüfung geöffnet zu haben. Bitte schließen Sie eine von ihnen. Andernfalls werden die Antworten nicht richtig aufgezeichnet und wirken sich auf Ihr Ergebnis aus.
