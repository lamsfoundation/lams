label.anonymous.confidence.level.tooltip = Wenn diese Option ausgewählt ist, werden die Namen der Schüler ausgeblendet. Nur der Prozentsatz des Vertrauens, den sie gewählt haben, erscheint neben der von ihnen gewählten Antwort.
