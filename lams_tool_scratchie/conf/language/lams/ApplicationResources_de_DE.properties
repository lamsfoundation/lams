label.authoring.advanced.shuffle.items.tooltip = Wenn diese Option aktiviert ist, wird die Reihenfolge der Fragen für jedes Team zufällig angeordnet. Dies trägt dazu bei, das Absprechen von Antworten zwischen Teams zu reduzieren und gleichzeitig den Bewertungsinhalt für alle gleich zu halten.
label.authoring.advanced.show.scratchies.in.results.tooltip = Nach Beendigung der Aktivität können die Schülerinnen und Schüler die Auswahl, die sie für jede Frage getroffen haben, als Team ansehen.
label.authoring.advanced.show.score.in.results.tooltip = Nach Abschluss der Aufgabe können die Schüler die Punktzahl einsehen, die sie als Team erreicht haben.
label.modify.default.marking.tooltip = Standardmäßig erhält ein Team 4 Punkte, wenn es beim ersten Versuch die richtige Antwort wählt, 2 Punkte beim zweiten Versuch, 1 Punkt beim dritten Versuch und keine Punkte für den vierten oder jeden weiteren Versuch. Diese Bewertungsmethode kann jedoch bei Bedarf geändert werden, indem die verfügbaren Optionen für die Bewertungsskala in den Einstellungen verwendet werden.
