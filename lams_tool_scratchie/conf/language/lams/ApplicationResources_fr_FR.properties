label.qb.stats.tooltip = L'analyse des items est une technique qui analyse les réponses des apprenants pour évaluer l'efficacité des questions d'un examen. Seuls les apprenants ayant terminé l'activité sont pris en compte. Il doit y avoir au moins 2 apprenants.
label.qb.difficulty.index.tooltip = L'indice de difficulté représente un pourcentage des réponses des élèves qui ont répondu correctement à la question. Cette métrique prend une valeur comprise entre 0 et 1. Les valeurs élevées indiquent que la question est facile, tandis que les valeurs faibles indiquent qu'elle est difficile. Une valeur de 0,3 à 0,7 est considérée comme bonne pour ce facteur et en dehors de cette plage, une amélioration est nécessaire.
label.qb.discrimination.index.tooltip = L'indice de discrimination mesure dans quelle mesure une question distingue les élèves ayant plus de connaissances ou de compétences de ceux qui en ont moins. Les valeurs proches de +1 indiquent que la question fait un bon travail de discrimination entre les plus performants et les moins performants. Une valeur de 0,2 à 1 est considérée comme bonne pour ce facteur, -0,2 à 0,2 est moyenne et inférieure à -0,2 nécessite une amélioration.
label.authoring.advanced.data.import = Importation de données
label.authoring.advanced.data.import.description = Importe les données de niveaux de confiance ou de réponses VSA provenant d'autres activités d'évaluation (par exemple un iRAT) pour les afficher dans cette activité.
label.authoring.advanced.discussion = Activer le vote sur le sentiment de discussion
label.authoring.advanced.discussion.tooltip = Lorsque cette option est activée, dans le cadre du suivi du TBL, les enseignants peuvent lancer des sondages instantanés pour chaque question brûlante afin d'évaluer la compréhension des étudiants.
label.vsa.allocate.button = Allouer des VSA
label.prevent.learner.autosave.mutliple.tabs = Vous semblez avoir deux onglets LAMS ouverts pour cet examen. Veuillez fermer l'un d'entre eux. Sinon, les réponses ne seront pas enregistrées correctement et affecteront votre score.
