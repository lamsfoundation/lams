label.modify.default.marking.tooltip = Par défaut, une équipe reçoit 4 points si elle trouve la bonne réponse du premier coup, 2 points au deuxième, 1 point au troisième, et aucun point au quatrième et aux suivants. Ce barème peut toutefois être modifié si nécessaire, grâce aux options de notation disponibles dans les paramètres.
