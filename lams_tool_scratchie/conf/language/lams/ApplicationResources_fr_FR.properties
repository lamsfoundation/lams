label.authoring.advanced.reveal.double.click.tooltip = Lorsque cette option est activée, les chefs d'équipe doivent double-cliquer sur une réponse pour afficher le résultat. Cette étape supplémentaire peut être particulièrement utile pour les évaluations sommatives, car elle fournit une couche de confirmation supplémentaire avant que le résultat ne soit affiché, ce qui contribue à réduire les sélections accidentelles et à maintenir l'intégrité de l'évaluation.
