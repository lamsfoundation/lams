label.authoring.advance.gallery.walk.cluster.tooltip = Gallery Walk sırasında, ekiplerin diğer ekiplerin yaptığı işleri değerlendirmesi/gözden geçirmesi gerekir. Çok sayıda ekip varsa, tek bir ekibin diğer tüm ekiplerin çalışmalarını incelemesi pratik olmayabilir. Bunu çözmek için, gözden geçirilecek ekip çalışmaları için asgari bir kota belirleme seçeneğiniz vardır. Her ekip en az belirtilen sayıda ekibi gözden geçirmekten sorumlu olacaktır. Ancak, bazı durumlarda (örneğin yalnızca birkaç ekip olduğunda) bu asgari sayı aşılabilir.
