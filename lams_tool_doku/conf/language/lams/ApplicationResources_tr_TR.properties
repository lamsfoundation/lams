label.authoring.advance.gallery.walk.enabled = Gallery Walk
label.authoring.advance.gallery.walk.info1 = Gallery Walk’u ekipler arası ve ekip içi tartışmayı, üst düzey düşünmeyi, işbirlikli öğrenmeyi ve takım oluşturmayı teşvik etmek için kullanın.
label.authoring.advance.gallery.walk.info2 = Etkinleştirildiğinde, derste Gallery Walk'u başlattıktan sonra, her takım için oluşturulan belge diğer tüm takımlarla paylaşılır. Takımlar daha sonra birbirlerine geri bildirim verebilir ve birbirlerinin çalışmalarını değerlendirebilir.
