label.gallery.walk.wait.start = Bu etkinlik kapsamında öğretmeniniz, diğer ekiplerin çalışmalarını görmenizi ve gerekirse yorum yapmanızı planladı. Bu süreç “Gallery Walk” olarak adlandırılır. Lütfen öğretmeninizin Gallery Walk’u başlatmasını bekleyin. Başlaması fazla gecikirse, yardım için öğretmeninizle iletişime geçin.
label.gallery.walk.wait.start.preview = Gallery Walka devam edin. Önizleme modunda olduğunuzdan hemen ilerleyebilirsiniz. Bu mesajı gören normal öğrenciler, öğretmenin izleme ekranından Gallery Walkı başlatmasını beklemek zorundadır.
label.gallery.walk.wait.finish.preview = Gallery Walk özetine devam et. Önizleme modunda olduğunuz için bunu hemen yapabilirsiniz. Bu mesajı alan normal öğrencilerin, öğretmenin izleme ekranında Gallery Walk'u bitirmesini beklemesi gerekir.
label.gallery.walk.preview = Önizleme modundasınız. Yalnızca kendi grubunuzu görüyorsunuz. Düzenli öğrenciler diğer grupların çalışmalarını görebilir, yorum yapabilir ve puanlayabilir.
