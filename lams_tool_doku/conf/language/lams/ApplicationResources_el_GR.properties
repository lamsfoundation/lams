label.authoring.advance.time.limit.activity = Δραστηριότητα
label.authoring.advance.time.limit.activity.description.1 = Όταν ο πρώτος μαθητής ξεκινά τη δοκιμή, ξεκινά ένα χρονόμετρο αντίστροφης μέτρησης και όλοι οι μαθητές πρέπει να ολοκληρώσουν τη δραστηριότητα πριν λήξει η αντίστροφη μέτρηση.
label.authoring.advance.time.limit.activity.description.2 = Επιλέξτε τον αριθμό των λεπτών για την αντίστροφη μέτρηση
label.authoring.advance.time.limit.individual = Μεμονωμένοι μαθητές
label.authoring.advance.time.limit.individual.description.1 = Κάθε μαθητής έχει ένα ατομικό χρονόμετρο αντίστροφης μέτρησης που ξεκινά όταν ξεκινάει.
label.authoring.advance.time.limit.individual.tooltip = Αυτός ο χρονοδιακόπτης διάρκειας είναι ιδανικός για ασύγχρονες δραστηριότητες, όπου οι μαθητές μπορούν να ξεκινήσουν σε διαφορετικές ώρες. Η καθορισμένη διάρκεια θα καθορίσει πόσο χρόνο έχει ο κάθε μαθητής να ολοκληρώσει τη δραστηριότητα, ξεκινώντας από τη στιγμή που θα ξεκινήσει.
label.authoring.advance.time.limit.activity.tooltip = Αυτό το χρονόμετρο αντίστροφης μέτρησης είναι τέλειο για σύγχρονες δραστηριότητες. Θα ξεκινήσει μόλις ο πρώτος μαθητής ξεκινήσει τη δραστηριότητα και όλοι οι μαθητές θα τελειώσουν μόλις ολοκληρωθεί.
label.authoring.advance.time.limit.individual.description.2 = Επιλέξτε τον αριθμό των λεπτών που θα πάρει κάθε μαθητής
label.authoring.advance.ai.chat.header = Συνομιλία ΤΝ
label.authoring.advance.ai.chat = Ενεργοποίηση συνομιλίας με μία προσωπικότητα ΤΝ
label.authoring.advance.ai.chat.tooltip = Επιτρέψτε στους εκπαιδευόμενους να συνομιλούν με μια προσωπικότητα ΤΝ κατά τη διάρκεια της δραστηριότητας. Η προσωπικότητα θα γνωρίζει την περιγραφή της δραστηριότητας και οποιαδήποτε επιπλέον πληροφορία παρέχετε στην οθόνη προσαρμογής. Δεν θα γνωρίζει, όμως, την τρέχουσα εργασία των εκπαιδευόμενων.
