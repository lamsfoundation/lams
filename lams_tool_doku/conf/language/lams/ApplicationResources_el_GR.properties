label.authoring.advance.gallery.walk.info2 = Εάν είναι ενεργοποιημένο, αφού ξεκινήσετε την Εποπτεία για τον "Περίπατο στην Έκθεση" (Gallery Walk)  το έγγραφο που δημιουργήθηκε για κάθε ομάδα κοινοποιείται σε όλες τις άλλες ομάδες. Οι ομάδες μπορούν στη συνέχεια να δώσουν στους άλλους ανατροφοδότηση και να αξιολογήσουν τις εργασίες τους.
