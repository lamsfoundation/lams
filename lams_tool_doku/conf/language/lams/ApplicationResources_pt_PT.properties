label.authoring.advance.gallery.walk.cluster.tooltip = Durante a Gallery Walk, as equipes são obrigadas a avaliar/revisar o trabalho realizado por outras equipes. Se houver um grande número de equipes, pode ser impraticável que uma única equipe revise o trabalho de todas as outras equipes. Para resolver isso, você tem a opção de estabelecer uma cota mínima de trabalhos em equipe para revisão. Cada equipe será responsável por revisar pelo menos o número especificado de equipes. Porém, em determinados cenários (como quando há poucas equipes), esse número mínimo pode ser ultrapassado.
