activity.title = Dépôt de fichiers
activity.description = Cet outil permet aux étudiants de télécharger un document ou un autre fichier numérique dans le cadre d'une activité, ce qui permet aux enseignants de définir des instructions et des critères clairs pour le travail qu'ils attendent. Il s'agit d'un moyen simple pour les étudiants de produire des devoirs, des rapports, des travaux créatifs ou des preuves pratiques en dehors de la plate-forme et de les soumettre pour examen. Une fois soumis, les fichiers sont stockés en toute sécurité et peuvent être consultés, téléchargés et évalués par l'enseignant, ce qui en fait un outil idéal pour les tâches qui suivent les activités de contenu ou de discussion ou pour conclure un plan de cours par un travail évalué.
activity.helptext = Les étudiants peuvent soumettre des fichiers pour évaluation par l'enseignant. Les notes et les commentaires de chaque étudiant sont enregistrés et peuvent être exportés sous forme de feuille de calcul.
