activity.title = 提交文件
activity.description = 此工具允许学生上传文档或其他数字文件作为活动的一部分，方便教师设定清晰的作业要求和标准。它为学生提供了一种简便的方式，让他们可以在平台之外完成作业、报告、创意作品或实践成果，并提交以供审核。文件提交后将被安全存储，教师可以查看、下载和评估，因此非常适合用于课后作业或讨论活动，也适合作为课程计划的总结性评估作业。
activity.helptext = 学生提交文件以供教师评估。每个学生的分数和评论都会被记录下来，并且可以作为电子表格导出。
