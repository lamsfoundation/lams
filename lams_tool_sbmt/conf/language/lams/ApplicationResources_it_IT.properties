activity.title = Invia file
activity.description = Questo strumento consente agli studenti di caricare un documento o un altro file digitale come parte di un'attività, permettendo agli insegnanti di stabilire istruzioni chiare e criteri per il lavoro che si aspettano. Questo strumento offre agli studenti un modo semplice per produrre compiti, relazioni, lavori creativi o prove pratiche al di fuori della piattaforma e consegnarli per la revisione. Una volta inviati, i file vengono archiviati in modo sicuro e possono essere visualizzati, scaricati e valutati dall'insegnante, il che lo rende ideale per i compiti che seguono i contenuti o le attività di discussione o per concludere un piano di lezione con un lavoro valutato.
activity.helptext = Gli studenti possono inviare file per la valutazione da parte dell'insegnante. I punteggi e i commenti di ogni studente vengono registrati e possono essere esportati come foglio di calcolo.
