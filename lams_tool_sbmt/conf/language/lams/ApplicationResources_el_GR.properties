activity.title = Υποβολή Αρχείου
activity.description = Αυτό το εργαλείο επιτρέπει στους μαθητές να ανεβάζουν ένα έγγραφο ή άλλο ψηφιακό αρχείο ως μέρος μιας δραστηριότητας, επιτρέποντας στους καθηγητές να θέτουν σαφείς οδηγίες και κριτήρια για την εργασία που αναμένουν. Παρέχει έναν απλό τρόπο για τους μαθητές να παράγουν εργασίες, εκθέσεις, δημιουργικές εργασίες ή πρακτικά στοιχεία εκτός της πλατφόρμας και να τα παραδίδουν για αξιολόγηση. Μόλις υποβληθούν, τα αρχεία αποθηκεύονται με ασφάλεια και μπορούν να προβληθούν, να μεταφορτωθούν και να αξιολογηθούν από τον εκπαιδευτικό, καθιστώντας το ιδανικό για εργασίες που ακολουθούν δραστηριότητες περιεχομένου ή συζητήσεις ή για την ολοκλήρωση ενός σχεδίου μαθήματος με ένα κομμάτι αξιολογημένης εργασίας.
activity.helptext = Οι φοιτητές μπορούν να υποβάλουν αρχεία για αξιολόγηση από τον διδάσκοντα. Οι βαθμολογίες και τα σχόλια για κάθε φοιτητή καταγράφονται και μπορούν να εξαχθούν ως υπολογιστικό φύλλο.
tool.display.name = Εργαλείο Υποβολής Αρχείου
tool.description = Αυτό το εργαλείο επιτρέπει στους μαθητές να ανεβάζουν ένα έγγραφο ή άλλο ψηφιακό αρχείο ως μέρος μιας δραστηριότητας, επιτρέποντας στους καθηγητές να θέτουν σαφείς οδηγίες και κριτήρια για την εργασία που αναμένουν. Παρέχει έναν απλό τρόπο για τους μαθητές να παράγουν εργασίες, εκθέσεις, δημιουργικές εργασίες ή πρακτικά στοιχεία εκτός της πλατφόρμας και να τα παραδίδουν για αξιολόγηση. Μόλις υποβληθούν, τα αρχεία αποθηκεύονται με ασφάλεια και μπορούν να προβληθούν, να μεταφορτωθούν και να αξιολογηθούν από τον εκπαιδευτικό, καθιστώντας το ιδανικό για εργασίες που ακολουθούν δραστηριότητες περιεχομένου ή συζητήσεις ή για την ολοκλήρωση ενός σχεδίου μαθήματος με ένα κομμάτι αξιολογημένης εργασίας.
