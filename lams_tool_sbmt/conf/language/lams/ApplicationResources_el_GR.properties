label.use.select.leader.tool.output.tooltip = Εάν χρησιμοποιείτε το εργαλείο Επιλογή αρχηγού για αυτό το μάθημα, η επιλογή αυτή σημαίνει ότι μόνο οι αρχηγοί κάθε ομάδας θα μπορούν να υποβάλλουν αρχεία εκ μέρους της ομάδας τους.
