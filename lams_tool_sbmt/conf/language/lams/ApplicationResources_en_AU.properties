activity.title = Submit Files
activity.description = This tool enables students to upload a document or other digital file as part of an activity, allowing teachers to set clear instructions and criteria for the work they expect. It provides a straightforward way for students to produce assignments, reports, creative work or practical evidence outside the platform and hand it in for review. Once submitted, files are securely stored and can be viewed, downloaded and assessed by the teacher, making it ideal for tasks that follow content or discussion activities or for concluding a lesson plan with a piece of assessed work.
activity.helptext = Students can submit files for assessment by the instructor. Scores and comments for each student are recorded and can be exported as a spreadsheet.
