activity.description = このツールにより、生徒は活動の一環として文書やその他のデジタルファイルをアップロードすることができ、教師は明確な指示と期待する作業の基準を設定することができます。学生がプラットフォーム外で課題、レポート、創造的な作品、実践的な証拠を作成し、レビューのために提出するための簡単な方法を提供します。提出されたファイルは安全に保存され、教師が閲覧、ダウンロード、評価することができます。コンテンツやディスカッション活動に続く課題や、評価された作品で授業計画を締めくくるのに理想的です。
activity.helptext = 学生は講師による評価のためにファイルを提出することができます。各生徒のスコアとコメントは記録され、スプレッドシートとしてエクスポートすることができます。
