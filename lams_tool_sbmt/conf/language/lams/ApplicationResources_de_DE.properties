activity.title = Dateien einreichen
activity.description = Mit diesem Tool können Schülerinnen und Schüler ein Dokument oder eine andere digitale Datei als Teil einer Aktivität hochladen, so dass Lehrkräfte klare Anweisungen und Kriterien für die erwartete Arbeit festlegen können. Es bietet eine unkomplizierte Möglichkeit für SchülerInnen, Aufgaben, Berichte, kreative Arbeiten oder praktische Nachweise außerhalb der Plattform zu erstellen und zur Überprüfung einzureichen. Die eingereichten Dateien werden sicher gespeichert und können von der Lehrkraft eingesehen, heruntergeladen und bewertet werden. Damit eignet sich die Plattform ideal für Aufgaben, die auf Inhalte oder Diskussionsaktivitäten folgen, oder um eine Unterrichtseinheit mit einer bewerteten Arbeit abzuschließen.
activity.helptext = Studierende können Dateien zur Bewertung durch den Dozenten einreichen. Die Bewertungen und Kommentare jedes Studierenden werden erfasst und können als Tabellenkalkulation exportiert werden.
