label.authoring.ai.rephrase.tooltip = Lorsque cette option est activée, les étudiants qui donnent un feedback ouvert entre pairs recevront une suggestion assistée par l'IA qui reformule leurs commentaires dans un langage plus constructif, précis et exploitable. L'IA s'appuie sur les écrits de l'étudiant, contribuant ainsi à un feedback efficace sans remplacer sa contribution initiale. Les étudiants peuvent relire et modifier la suggestion de l'IA avant de la soumettre. Cette fonctionnalité est conçue pour favoriser une communication plus claire et améliorer la qualité globale du feedback entre pairs.
