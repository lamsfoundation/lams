label.show.ratings.left.for.user.tooltip = Lorsque cette option est activée, les étudiants peuvent voir les commentaires qu'ils ont reçus de leurs pairs après avoir effectué une évaluation.
label.self.review.tooltip = Si cette option est activée, les élèves procéderont à une auto-évaluation, en s'évaluant eux-mêmes selon les mêmes critères que ceux utilisés pour évaluer leurs pairs.
label.max.number.marks.each.user.tooltip = Si nécessaire, définissez le nombre maximal d'évaluations qu'un étudiant peut effectuer. Ceci s'applique uniquement aux évaluations par étoiles.
label.authoring.advance.lock.on.finished.tooltip = Une fois activée, cette option empêche les étudiants d'apporter des modifications après avoir soumis leurs évaluations.
label.rating.rubrics.view.tooltip = Lorsque vous utilisez des grilles d'évaluation, vous pouvez choisir leur mode d'affichage. Si vous sélectionnez « Étudiant », les noms des étudiants apparaissent en lignes et les critères d'évaluation en colonnes. Si vous sélectionnez « Grille d'évaluation », ce sont les critères qui apparaissent en lignes et les noms des étudiants en colonnes.
label.rating.rubrics.in.between.enable.tooltip = Lors de la création d'une grille d'évaluation, l'expression « entre les colonnes » désigne généralement la nécessité d'un langage clair et cohérent, ainsi que d'une progression logique de la qualité entre les niveaux de performance adjacents. Cela permet aux élèves de comprendre facilement les différences entre deux niveaux de réussite.
label.show.ratings.left.info.title = Retour d'information après l'achèvement du projet
label.show.ratings.left.by.user.tooltip = Lorsque cette option est activée, les étudiants peuvent voir les commentaires qu'ils ont donnés à leurs pairs après avoir effectué une évaluation.
