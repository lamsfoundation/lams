label.show.ratings.left.info = Cosa possono vedere gli studenti dopo aver completato la valutazione
label.show.ratings.left.for.user.tooltip = Se abilitata, gli studenti vedranno il feedback ricevuto dai loro compagni dopo aver completato una valutazione.
label.self.review.tooltip = Se abilitata, gli studenti completeranno un'autovalutazione, valutandosi con gli stessi criteri che utilizzano per valutare i loro coetanei.
label.max.number.marks.each.user.tooltip = Se necessario, impostare il numero massimo di valutazioni che uno studente può completare. Questo vale solo per i tipi di valutazione a stella.
label.authoring.advance.lock.on.finished.tooltip = Se abilitata, gli studenti non potranno apportare modifiche dopo aver inviato le loro valutazioni.
label.rating.rubrics.view.tooltip = Quando si utilizzano le rubriche, è possibile scegliere come visualizzarle. Se si seleziona Studente, i nomi degli studenti vengono visualizzati nelle righe e i criteri di valutazione nelle colonne. Se si seleziona Rubrica, i criteri vengono visualizzati nelle righe e i nomi degli studenti nelle colonne.
label.rating.rubrics.in.between.enable.tooltip = Quando si crea una rubrica, il concetto di "tra le colonne" si riferisce in genere alla necessità di un linguaggio chiaro e coerente e di una progressione logica della qualità tra livelli di prestazione adiacenti. Questo garantisce che gli studenti possano comprendere facilmente le differenze tra un livello di rendimento e il successivo.
label.show.ratings.left.info.title = Feedback dopo il completamento
label.show.ratings.left.by.user.tooltip = Se abilitata, gli studenti vedranno il feedback che hanno dato ai loro compagni dopo aver completato una valutazione.
