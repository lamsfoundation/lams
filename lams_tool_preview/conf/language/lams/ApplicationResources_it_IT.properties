label.authoring.ai.rephrase = Feedback quantitativo assistito dall'intelligenza artificiale
label.authoring.ai.rephrase.tooltip = Quando questa opzione è abilitata, agli studenti che forniscono feedback tra pari aperti verrà offerto un suggerimento assistito dall'IA che riformula i loro commenti in un linguaggio più costruttivo, specifico e attuabile. L'IA si basa su ciò che lo studente ha scritto, contribuendo a modellare un feedback efficace senza sostituire il contributo originale dello studente. Gli studenti possono rivedere e modificare il suggerimento dell'IA prima di inviarlo. Questa funzionalità è progettata per supportare una comunicazione più chiara e migliorare la qualità complessiva del feedback tra pari.
label.rating.comment.ai.rephrase.button = Riformulazione AI
label.rating.comment.ai.rephrase.description = Forse potreste considerare di riformulare il vostro contributo in un feedback costruttivo e attuabile.
