label.max.number.marks.each.user.tooltip = 必要に応じて、生徒が完了できる評価の最大数を設定します。これは星評価タイプにのみ適用されます。
label.authoring.advance.lock.on.finished.tooltip = 有効にすると、学生は評価を送信した後に変更を加えることができなくなります。
label.rating.rubrics.view.tooltip = ルーブリックを使用する場合、ルーブリックの表示方法を選択することができます。学生を選択した場合、学生の名前が行に、評価基準が列に表示されます。ルーブリックを選択した場合、評価基準は行に、学生の名前は列に表示されます。
label.rating.rubrics.in.between.enable.tooltip = ルーブリックを作成する際に「中間の列」という概念を用いるのは、通常、明確で一貫性のある表現と、隣接するパフォーマンスレベル間の質の論理的な推移を示す必要があることを意味します。これにより、生徒は達成度レベルの違いを容易に理解できるようになります。
