label.authoring.ai.rephrase.tooltip = このオプションを有効にすると、自由形式のピアフィードバックを行う学生に、AIによる提案が表示されます。この提案は、学生のコメントをより建設的で具体的、かつ実践的な言葉に言い換えるものです。AIは学生の記入内容に基づいて、元の入力内容を置き換えることなく効果的なフィードバックをモデル化します。学生は提出前にAIの提案を確認し、編集することができます。この機能は、より明確なコミュニケーションをサポートし、ピアフィードバックの全体的な質を向上させるために設計されています。
