label.authoring.ai.rephrase = AI assisted quantitative feedback
label.authoring.ai.rephrase.tooltip = When this option is enabled, students who are giving open-ended peer feedback will be offered an AI-assisted suggestion that rephrases their comments into more constructive, specific, and actionable language. The AI draws on what the student has written, helping to model effective feedback without replacing the student''s original input. Students can review and edit the AI suggestion before submitting. This feature is designed to support clearer communication and improve the overall quality of peer feedback.
