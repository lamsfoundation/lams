label.show.ratings.left.for.user.tooltip = When enabled, students will see the feedback they received from their peers after completing an evaluation.
label.self.review.tooltip = If enabled, students will complete a self-evaluation, assessing themselves with the same criteria they use to review their peers.
label.max.number.marks.each.user.tooltip = If needed, set the maximum number of evaluations a student can complete. This applies only to Star Rating types.
label.authoring.advance.lock.on.finished.tooltip = When enabled, students cannot make changes after submitting their evaluations.
label.rating.rubrics.view.tooltip = When using rubrics, you can choose how the rubric is displayed. If you select Student, students’ names appear in the rows and the evaluation criteria in the columns. If you select Rubric, the criteria appear in the rows and the students’ names in the columns.
label.rating.rubrics.in.between.enable.tooltip = When creating a rubric, the concept of "in between columns" typically refers to the need for clear and consistent language and a logical progression of quality between adjacent performance levels. This ensures students can easily understand the differences between one level of achievement and the next.
label.show.ratings.left.info.title = Feedback after completion
label.show.ratings.left.by.user.tooltip = When enabled, students will see the feedback they gave their peers after completing an evaluation.
