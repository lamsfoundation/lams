label.rating.rubrics.in.between.categories.tootlip = Demonstriert eine Kombination der oben und unten beschriebenen Attribute.
label.show.ratings.left.info = Was Studierende nach Abschluss der Bewertung sehen können
label.show.ratings.left.for.user.tooltip = Wenn diese Funktion aktiviert ist, sehen die Studierenden nach Abschluss einer Bewertung das Feedback, das sie von ihren Kommilitonen erhalten haben.
label.self.review.tooltip = Sofern diese Option aktiviert ist, führen die Studierenden eine Selbsteinschätzung durch und beurteilen sich selbst anhand der gleichen Kriterien, die sie auch zur Beurteilung ihrer Kommilitonen verwenden.
label.max.number.marks.each.user.tooltip = Legen Sie bei Bedarf die maximale Anzahl an Bewertungen fest, die ein Schüler abgeben kann. Dies gilt nur für Sternebewertungen.
label.authoring.advance.lock.on.finished.tooltip = Wenn diese Funktion aktiviert ist, können Studierende nach dem Absenden ihrer Bewertungen keine Änderungen mehr vornehmen.
label.rating.rubrics.view.tooltip = Bei der Verwendung von Bewertungsrastern können Sie die Darstellungsweise auswählen. Wählen Sie „Schüler“, werden die Namen der Schüler in den Zeilen und die Bewertungskriterien in den Spalten angezeigt. Wählen Sie „Bewertungsraster“, werden die Kriterien in den Zeilen und die Namen der Schüler in den Spalten angezeigt.
label.rating.rubrics.in.between.enable.tooltip = Bei der Erstellung eines Beurteilungsrasters bezieht sich der Begriff „zwischen den Spalten“ typischerweise auf die Notwendigkeit einer klaren und einheitlichen Sprache sowie einer logischen Qualitätssteigerung zwischen benachbarten Leistungsstufen. Dies stellt sicher, dass die Schüler die Unterschiede zwischen den einzelnen Leistungsstufen leicht verstehen können.
label.show.ratings.left.info.title = Feedback nach Fertigstellung
label.show.ratings.left.by.user.tooltip = Wenn diese Funktion aktiviert ist, sehen die Studierenden nach Abschluss einer Bewertung das Feedback, das sie ihren Kommilitonen gegeben haben.
