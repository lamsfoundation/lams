label.authoring.ai.rephrase.tooltip = Wenn diese Option aktiviert ist, erhalten Studierende, die offenes Peer-Feedback geben, einen KI-gestützten Vorschlag, der ihre Kommentare in eine konstruktivere, spezifischere und handlungsorientiertere Sprache umformuliert. Die KI greift auf die Texte der Studierenden zurück und hilft so, effektives Feedback zu modellieren, ohne deren ursprüngliche Eingabe zu ersetzen. Studierende können den KI-Vorschlag vor dem Absenden überprüfen und bearbeiten. Diese Funktion soll eine klarere Kommunikation unterstützen und die Gesamtqualität des Peer-Feedbacks verbessern.
